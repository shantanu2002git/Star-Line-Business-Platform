openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Star Line business platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: products
  - name: categories
  - name: services
  - name: customers
  - name: orders
  - name: requests
  - name: reviews
  - name: inventory
  - name: billing
  - name: content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get admin dashboard summary
      responses:
        "200":
          description: Dashboard metrics and chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: category
          in: query
          schema: { type: string }
        - name: featured
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      responses:
        "204": { description: Product deleted }
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List product categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
  /categories/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      responses:
        "204": { description: Category deleted }
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List Star Line services
      responses:
        "200":
          description: Service list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
    post:
      operationId: createService
      tags: [services]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
  /services/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceUpdate" }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      responses:
        "204": { description: Service deleted }
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /customers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      responses:
        "204": { description: Customer deleted }
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order
      responses:
        "204": { description: Order deleted }
  /requests:
    get:
      operationId: listServiceRequests
      tags: [requests]
      summary: List service and document requests
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Request list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRequestList" }
    post:
      operationId: createServiceRequest
      tags: [requests]
      summary: Submit a service request with documents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequestInput" }
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRequest" }
  /requests/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateServiceRequest
      tags: [requests]
      summary: Update request status and notes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequestUpdate" }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRequest" }
    delete:
      operationId: deleteServiceRequest
      tags: [requests]
      summary: Delete a request
      responses:
        "204": { description: Request deleted }
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List product reviews
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: visibility
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a product review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /reviews/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateReview
      tags: [reviews]
      summary: Edit or moderate a review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewUpdate" }
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review
      responses:
        "204": { description: Review deleted }
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryItem" }
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryInput" }
      responses:
        "201":
          description: Created inventory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
  /inventory/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryUpdate" }
      responses:
        "200":
          description: Updated inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete inventory item
      responses:
        "204": { description: Inventory item deleted }
  /invoices:
    get:
      operationId: listInvoices
      tags: [billing]
      summary: List invoices
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      tags: [billing]
      summary: Generate an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: deleteInvoice
      tags: [billing]
      summary: Delete an invoice
      responses:
        "204": { description: Invoice deleted }
  /banners:
    get:
      operationId: listBanners
      tags: [content]
      summary: List homepage banners
      responses:
        "200":
          description: Banner list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Banner" }
    post:
      operationId: createBanner
      tags: [content]
      summary: Create a banner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerInput" }
      responses:
        "201":
          description: Created banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
  /banners/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateBanner
      tags: [content]
      summary: Update a banner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerUpdate" }
      responses:
        "200":
          description: Updated banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
    delete:
      operationId: deleteBanner
      tags: [content]
      summary: Delete a banner
      responses:
        "204": { description: Banner deleted }
  /offers:
    get:
      operationId: listOffers
      tags: [content]
      summary: List offers
      responses:
        "200":
          description: Offer list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Offer" }
    post:
      operationId: createOffer
      tags: [content]
      summary: Create an offer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferInput" }
      responses:
        "201":
          description: Created offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
  /offers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateOffer
      tags: [content]
      summary: Update an offer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferUpdate" }
      responses:
        "200":
          description: Updated offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
    delete:
      operationId: deleteOffer
      tags: [content]
      summary: Delete an offer
      responses:
        "204": { description: Offer deleted }
  /content:
    get:
      operationId: listContentPages
      tags: [content]
      summary: List website content
      responses:
        "200":
          description: Content list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContentPage" }
    post:
      operationId: createContentPage
      tags: [content]
      summary: Create a content page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentPageInput" }
      responses:
        "201":
          description: Created content page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentPage" }
  /content/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateContentPage
      tags: [content]
      summary: Update website content
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentPageUpdate" }
      responses:
        "200":
          description: Updated content page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentPage" }
    delete:
      operationId: deleteContentPage
      tags: [content]
      summary: Delete website content
      responses:
        "204": { description: Content page deleted }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    Product:
      type: object
      required: [id, name, category, price, stock, rating, reviews, image, featured, description]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        price: { type: number }
        stock: { type: integer }
        rating: { type: number }
        reviews: { type: integer }
        image: { type: string }
        featured: { type: boolean }
        description: { type: string }
    ProductInput:
      type: object
      required: [name, category, price, stock, image, description]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        image: { type: string }
        featured: { type: boolean }
        description: { type: string }
    ProductUpdate:
      allOf: [{ $ref: "#/components/schemas/ProductInput" }]
    Category:
      type: object
      required: [id, name, slug, productCount]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        productCount: { type: integer }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
    CategoryUpdate:
      allOf: [{ $ref: "#/components/schemas/CategoryInput" }]
    Service:
      type: object
      required: [id, name, description, startingPrice, turnaround, icon, active]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        startingPrice: { type: number }
        turnaround: { type: string }
        icon: { type: string }
        active: { type: boolean }
    ServiceInput:
      type: object
      required: [name, description, startingPrice, turnaround, icon]
      properties:
        name: { type: string }
        description: { type: string }
        startingPrice: { type: number, minimum: 0 }
        turnaround: { type: string }
        icon: { type: string }
        active: { type: boolean }
    ServiceUpdate:
      allOf: [{ $ref: "#/components/schemas/ServiceInput" }]
    Customer:
      type: object
      required: [id, name, email, phone, orders, joinedAt, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        orders: { type: integer }
        joinedAt: { type: string }
        status: { type: string }
    CustomerInput:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        status: { type: string }
    CustomerUpdate:
      allOf: [{ $ref: "#/components/schemas/CustomerInput" }]
    Order:
      type: object
      required: [id, customer, items, total, status, date, payment]
      properties:
        id: { type: string }
        customer: { type: string }
        items: { type: string }
        total: { type: number }
        status: { type: string }
        date: { type: string }
        payment: { type: string }
    OrderInput:
      type: object
      required: [customer, items, total, payment]
      properties:
        customer: { type: string }
        items: { type: string }
        total: { type: number, minimum: 0 }
        status: { type: string }
        payment: { type: string }
    OrderUpdate:
      allOf: [{ $ref: "#/components/schemas/OrderInput" }]
    Document:
      type: object
      required: [name, type, size]
      properties:
        name: { type: string }
        type: { type: string }
        size: { type: string }
        url: { type: string }
    ServiceRequest:
      type: object
      required: [id, reference, customer, service, status, submittedAt, dueDate, documents, notes, amount]
      properties:
        id: { type: string }
        reference: { type: string }
        customer: { type: string }
        service: { type: string }
        status: { type: string }
        submittedAt: { type: string }
        dueDate: { type: string }
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        notes: { type: string }
        amount: { type: number }
    ServiceRequestInput:
      type: object
      required: [customer, service, documents, notes]
      properties:
        customer: { type: string }
        service: { type: string }
        dueDate: { type: string }
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        notes: { type: string }
        amount: { type: number, minimum: 0 }
    ServiceRequestUpdate:
      type: object
      properties:
        status: { type: string }
        notes: { type: string }
        dueDate: { type: string }
        amount: { type: number, minimum: 0 }
    Review:
      type: object
      required: [id, product, customer, rating, comment, date, visibility]
      properties:
        id: { type: string }
        product: { type: string }
        customer: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        date: { type: string }
        visibility: { type: string }
    ReviewInput:
      type: object
      required: [product, customer, rating, comment]
      properties:
        product: { type: string }
        customer: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        visibility: { type: string }
    ReviewUpdate:
      allOf: [{ $ref: "#/components/schemas/ReviewInput" }]
    InventoryItem:
      type: object
      required: [id, product, sku, onHand, reserved, reorderPoint, status]
      properties:
        id: { type: string }
        product: { type: string }
        sku: { type: string }
        onHand: { type: integer }
        reserved: { type: integer }
        reorderPoint: { type: integer }
        status: { type: string }
    InventoryInput:
      type: object
      required: [product, sku, onHand, reserved, reorderPoint]
      properties:
        product: { type: string }
        sku: { type: string }
        onHand: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        reorderPoint: { type: integer, minimum: 0 }
    InventoryUpdate:
      allOf: [{ $ref: "#/components/schemas/InventoryInput" }]
    Invoice:
      type: object
      required: [id, number, customer, orderId, amount, status, issuedAt, dueAt]
      properties:
        id: { type: string }
        number: { type: string }
        customer: { type: string }
        orderId: { type: string }
        amount: { type: number }
        status: { type: string }
        issuedAt: { type: string }
        dueAt: { type: string }
    InvoiceInput:
      type: object
      required: [customer, orderId, amount, dueAt]
      properties:
        customer: { type: string }
        orderId: { type: string }
        amount: { type: number, minimum: 0 }
        dueAt: { type: string }
    Banner:
      type: object
      required: [id, title, subtitle, cta, accent, active]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        cta: { type: string }
        accent: { type: string }
        active: { type: boolean }
    BannerInput:
      type: object
      required: [title, subtitle, cta, accent]
      properties:
        title: { type: string }
